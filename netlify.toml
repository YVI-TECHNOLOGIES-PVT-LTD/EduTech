[build]
  base = "apps/web_app"
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9.15.4"

[context.production.environment]
  # Default production API URL (can be overridden in Netlify dashboard)
  VITE_API_URL = "https://appsms-076a.onrender.com/api"

[context.deploy-preview.environment]
  VITE_API_URL = "https://appsms-076a.onrender.com/api"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
