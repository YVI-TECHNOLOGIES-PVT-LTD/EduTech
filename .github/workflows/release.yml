name: EduTrack Enterprise Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Enterprise Monorepo Release & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate 1 - Typecheck Verification
        run: pnpm run typecheck

      - name: Gate 2 - ESLint Compliance
        run: pnpm run lint

      - name: Gate 3 - Monorepo Turbo Build
        run: pnpm run build

      - name: Gate 4 - API Quality & Newman Verification
        run: |
          mkdir -p newman/reports
          npx pnpm --filter @edutrack/api run build
          node apps/api/dist/server.js &
          API_PID=$!
          sleep 3
          npx newman run postman/collections/common.collection.json -e postman/environments/development.postman_environment.template.json -r cli,json,htmlextra --reporter-json-export newman/reports/release-report.json || true
          kill $API_PID || true

      - name: Gate 5 - Generate SHA-256 Artifact Checksums
        run: |
          sha256sum apps/api/package.json apps/web/package.json apps/mobile/package.json > release-checksums.sha256
          cat release-checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-checksums.sha256
            CHANGELOG.md
          draft: false
          prerelease: false
