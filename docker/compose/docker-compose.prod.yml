# ==============================================================================
# EduTrack Enterprise ERP — Production Hardening Override Specification
# Usage: docker-compose -f docker/compose/docker-compose.yml -f docker/compose/docker-compose.prod.yml up -d
# ==============================================================================
version: '3.8'

services:
  api:
    restart: always
    env_file:
      - ../../apps/backend/.env
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  web:
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
