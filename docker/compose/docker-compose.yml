# ==============================================================================
# EduTrack Enterprise ERP — Primary Compose Specification
# ==============================================================================
version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    image: ghcr.io/edutrack/api:2.11.0
    container_name: edutrack-api
    ports:
      - '3000:3000'
    env_file:
      - ../../apps/backend/.env
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health/live']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      org.opencontainers.image.title: 'EduTrack Backend API'
      org.opencontainers.image.description: 'Express.js REST API Microservice'
      org.opencontainers.image.vendor: 'EduTrack Enterprise'
      org.opencontainers.image.version: '2.11.0'
    networks:
      - frontend-network
      - backend-network

  web:
    build:
      context: ../..
      dockerfile: apps/web_app/Dockerfile
    image: ghcr.io/edutrack/web:2.11.0
    container_name: edutrack-web
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      org.opencontainers.image.title: 'EduTrack Web Frontend'
      org.opencontainers.image.description: 'React SPA Web Application served via Nginx'
      org.opencontainers.image.vendor: 'EduTrack Enterprise'
      org.opencontainers.image.version: '2.11.0'
    networks:
      - frontend-network

# ==============================================================================
# Logical Network Architecture
# ==============================================================================
networks:
  frontend-network:
    name: edutrack-frontend-net
    driver: bridge
  backend-network:
    name: edutrack-backend-net
    driver: bridge
  internal-network:
    name: edutrack-internal-net
    driver: bridge
  monitor-network:
    name: edutrack-monitor-net
    driver: bridge

# ==============================================================================
# Persistent Storage Volumes Architecture
# ==============================================================================
volumes:
  api-logs:
    name: edutrack-api-logs
