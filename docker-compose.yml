version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ghcr.io/edutrack/api:2.11.0
    container_name: edutrack-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    restart: unless-stopped
    networks:
      - edutrack-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/edutrack/web:2.11.0
    container_name: edutrack-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - edutrack-network

networks:
  edutrack-network:
    driver: bridge
